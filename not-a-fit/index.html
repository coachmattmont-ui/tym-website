<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not a Fit Right Now — Tym</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #0b0d10;
    --bg-elev: #14181d;
    --bg-card: #181d24;
    --border: #232a34;
    --border-strong: #2f3845;
    --text: #f2f4f7;
    --text-muted: #9aa4b2;
    --text-soft: #c8cfd8;
    --accent: #2563EB;
    --accent-soft: #2563EB25;
    --accent-strong: #3B7AFF;
    --max-width: 720px;
    --gutter: clamp(18px, 5vw, 24px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--gutter); width: 100%; }

  /* HEADER */
  header {
    padding: 22px 0;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-weight: 700;
    font-size: clamp(14px, 3.4vw, 19px);
    letter-spacing: -0.01em;
    color: var(--text);
    text-decoration: none;
  }
  .logo span { color: var(--accent); }

  /* MAIN */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: clamp(60px, 12vw, 100px) 0;
  }
  .message-card {
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
  }
  .eyebrow {
    display: inline-block;
    background: var(--bg-elev);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 22px;
    border: 1px solid var(--border);
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin: 0 auto 20px;
    max-width: 500px;
    text-wrap: balance;
  }
  .lead {
    color: var(--text-soft);
    font-size: clamp(17px, 2vw, 19px);
    max-width: 480px;
    margin: 0 auto 36px;
    line-height: 1.55;
  }
  .cta-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    padding: 13px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text);
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .btn:hover {
    border-color: var(--accent);
    background: var(--bg-elev);
    transform: translateY(-1px);
  }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    padding: 24px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    background: var(--bg-elev);
  }
</style>

<body>

<header>
  <div class="wrap">
    <a href="/" class="logo">Tym <span>·</span> SmartHome Brothers</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="message-card">
      <div class="eyebrow">Thanks for reaching out</div>
      <h1>Sounds like this isn't the right fit just yet.</h1>
      <p class="lead">Our design + delivery service is built for projects with a specific budget and timeline. If either shifts down the road, we'd love to hear from you.</p>
      <div class="cta-row">
        <a href="/" class="btn">← Back to home</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    Tym · SmartHome Brothers™
  </div>
</footer>

</body>
</html>
